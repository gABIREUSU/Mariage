<ion-content [fullscreen]="true" class="novo-cliente-background">
  <ion-grid class="ion-no-padding">
    <ion-row class="ion-justify-content-center">

      <ion-col size="12" size-sm="10" size-md="7" size-lg="5" class="page-container">

        <div class="page-header">
          <h1>Novo Cliente</h1>
          <p>Cadastre os noivos para o serviço de filmagem</p>
        </div>

        <ion-card class="form-card">
          <ion-card-content>
            <form (ngSubmit)="cadastrarCliente()">

              <div class="input-group">
                <ion-label class="input-label">Nome da Noiva</ion-label>
                <div class="custom-input-wrapper">
                  <ion-icon name="person-outline" class="input-icon"></ion-icon>
                  <ion-input
                    type="text"
                    placeholder="Ex.: Maria Silva"
                    [(ngModel)]="nomeNoiva"
                    name="nomeNoiva"
                    required>
                  </ion-input>
                </div>
              </div>

              <div class="input-group">
                <ion-label class="input-label">Nome do Noivo</ion-label>
                <div class="custom-input-wrapper">
                  <ion-icon name="person-outline" class="input-icon"></ion-icon>
                  <ion-input
                    type="text"
                    placeholder="Ex.: João Souza"
                    [(ngModel)]="nomeNoivo"
                    name="nomeNoivo"
                    required>
                  </ion-input>
                </div>
              </div>

              <div class="input-group">
                <ion-label class="input-label">E-mail principal</ion-label>
                <div class="custom-input-wrapper">
                  <ion-icon name="mail-outline" class="input-icon"></ion-icon>
                  <ion-input
                    type="email"
                    placeholder="casal@email.com"
                    [(ngModel)]="emailPrincipal"
                    name="emailPrincipal"
                    required>
                  </ion-input>
                </div>
              </div>

              <div class="input-group">
                <ion-label class="input-label">Telefone | WhatsApp</ion-label>
                <div class="custom-input-wrapper">
                  <ion-icon name="logo-whatsapp" class="input-icon"></ion-icon>
                  <ion-input
                    type="tel"
                    placeholder="(00) 00000-0000"
                    [(ngModel)]="telefoneWhatsapp"
                    (ionInput)="aoDigitarTelefone($event)"
                    name="telefoneWhatsapp"
                    required>
                  </ion-input>
                </div>
              </div>

              <div class="btn-container">
                <ion-button type="submit" class="btn-cadastrar" shape="round" [disabled]="salvando">
                  CADASTRAR CLIENTE
                </ion-button>
              </div>

            </form>
          </ion-card-content>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
